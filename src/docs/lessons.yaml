paths:
  /classes/{id}/lessons:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Lessons]
      operationId: getLessonsByClass
      summary: Lấy bài học của lớp
      description: 'Quyền: LESSON_READ. Cần là mentor, thành viên hoặc có CLASS_READ_ALL. id là ID lớp. Sắp xếp theo lesson_order; completed_at phản ánh tiến độ của người đang đăng nhập.'
      responses:
        '200': { $ref: '#/components/responses/LessonList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    post:
      tags: [Lessons]
      operationId: createLesson
      summary: Tạo bài học cho lớp
      description: 'Quyền: LESSON_CREATE và phải là mentor của chính lớp này. order là số nguyên dương, duy nhất trong lớp.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateLessonRequest' }
      responses:
        '201': { $ref: '#/components/responses/LessonCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /classes/{id}/progress:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Lessons]
      operationId: getClassProgress
      summary: Lấy tiến độ học tập của bản thân
      description: 'Quyền: PROGRESS_READ_OWN và phải là thành viên của lớp. id là ID lớp. progress là phần trăm hoàn thành, bằng 0 nếu lớp chưa có bài học.'
      responses:
        '200': { $ref: '#/components/responses/ClassProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /lessons/{id}:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    get:
      tags: [Lessons]
      operationId: getLessonById
      summary: Lấy bài học theo ID
      description: 'Quyền: LESSON_READ. Cần là mentor, thành viên của lớp hoặc có CLASS_READ_ALL.'
      responses:
        '200': { $ref: '#/components/responses/Lesson' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [Lessons]
      operationId: updateLesson
      summary: Cập nhật bài học
      description: 'Quyền: LESSON_UPDATE và phải là mentor của lớp. Chỉ gửi các trường muốn thay đổi; order không được trùng bài học khác trong lớp.'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateLessonRequest' }
      responses:
        '200': { $ref: '#/components/responses/Lesson' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    delete:
      tags: [Lessons]
      operationId: deleteLesson
      summary: Xóa bài học
      description: 'Quyền: LESSON_DELETE và phải là mentor của lớp. Trả về bài học đã xóa.'
      responses:
        '200': { $ref: '#/components/responses/Lesson' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /lessons/{id}/complete:
    parameters:
      - { $ref: '#/components/parameters/Id' }
    post:
      tags: [Lessons]
      operationId: completeLesson
      summary: Đánh dấu đã hoàn thành bài học
      description: 'Quyền: LESSON_COMPLETE và phải là thành viên của lớp. Không cần body. Gọi lại trả về tiến độ đã có, không tạo bản ghi trùng.'
      responses:
        '200': { $ref: '#/components/responses/LessonProgress' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
