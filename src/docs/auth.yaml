paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: Đăng ký tài khoản
      description: Tạo người dùng mới với vai trò MEMBER. Mật khẩu ít nhất 6 ký tự.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201': { $ref: '#/components/responses/UserCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Đăng nhập
      description: Trả về thông tin người dùng, accessToken và refreshToken. Dùng accessToken trong Authorize để gọi các API được bảo vệ.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200': { $ref: '#/components/responses/Login' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/me:
    get:
      tags: [Auth]
      operationId: getMe
      summary: Lấy thông tin tài khoản hiện tại
      description: Cần access token hợp lệ; không yêu cầu quyền quản trị người dùng.
      responses:
        '200': { $ref: '#/components/responses/AuthUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Làm mới access token
      description: Gửi refreshToken từ lần đăng nhập trong JSON body. Không sử dụng cookie để đọc refresh token và không cần access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200': { $ref: '#/components/responses/AccessToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
